# DataSmith — 云端 API 限速合规配置模板
# 适用场景：阿里云百炼 / DeepSeek / Anthropic 等有严格 RPM/TPM 限制的云端 API
# 双桶限流器确保 100% 完成率，避免 429 错误导致数据丢失

name: cloud-api-rate-limited

source:
  type: jsonl
  path: ./demo/datasets/cloud_api_eval_500.jsonl

pipeline:
  - step: generate
    strategy: evol-instruct
    depth: 2
    mutation_types:
      - constraints
      - deepen
    llm:
      # ---- 阿里云百炼示例 ----
      provider: bailian
      model: qwen-plus-2025-12-01
      api_key: ${DASHSCOPE_API_KEY}    # 从环境变量读取
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      rpm_limit: 120                   # 根据你的 API 套餐设置，严格不超过 provider 限制
      tpm_limit: 1000000
      generation_kwargs:
        temperature: 0.8
        max_tokens: 1024

      # ---- DeepSeek 示例（注释取消即可切换）----
      # provider: openai
      # model: deepseek-chat
      # api_key: ${DEEPSEEK_API_KEY}
      # base_url: https://api.deepseek.com/v1
      # rpm_limit: 60
      # tpm_limit: 2000000

  - step: evaluate
    evaluator: regex-filter
    blacklist_patterns:
      - "对不起，我无法"
      - "作为 AI 助手"
      - "I cannot"

sink:
  path: ./output/cloud_output.jsonl
  checkpoint_dir: ./.datasmith_runs    # 必须开启！云端 API 中断后可断点续传，避免重复计费
  dead_letter_path: ./output/rejected.jsonl

concurrency: 30                        # 云端 API 并发不宜过高，建议 20-50
mode: streaming
