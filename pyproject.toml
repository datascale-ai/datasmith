[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datasmith"
version = "1.0.0"
description = "High-concurrency end-to-end data synthesis and curation middleware for the LLM era"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "openai>=1.0",
    "pydantic>=2.0",
    "aiofiles>=23.0",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
rag-parse = [
    "PyMuPDF>=1.23",
    "python-docx>=1.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]
distributed = [
    "redis[hiredis]>=5.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest-cov>=5.0",
    "types-aiofiles>=23.0",
    "types-PyYAML>=6.0",
]

[project.scripts]
datasmith = "datasmith.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/datasmith"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = [
    "--ignore=tests/experiments",
    "--ignore=tests/test_exp5_analyze_compat.py",
    "--ignore=tests/test_exp5_eval_wrapper.py",
    "--ignore=tests/test_experiment_analyzers.py",
    "--ignore=tests/test_framework_baseline_args.py",
    "--ignore=tests/test_result_schema.py",
    "--ignore=tests/test_run_prefix_cache.py",
    "--ignore=tests/test_run_throughput.py",
    "--ignore=tests/test_vllm_metrics.py",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_return_any = false
files = ["src/datasmith"]

[[tool.mypy.overrides]]
module = [
    "datasmith.pipeline",
    "datasmith.benchmark.tasks.*",
    "datasmith.benchmark.runner",
    "datasmith.assessment.runner",
    "datasmith.clients.openai_client",
    "datasmith.engine.redis_checkpoint",
    "datasmith.engine.redis_rate_limiter",
    "datasmith.engine.sqlite_checkpoint",
    "datasmith.registry",
    "datasmith.config.benchmark_schema",
    "datasmith.config.assessment_schema",
    "datasmith.config.loader",
]
ignore_errors = true

[tool.coverage.run]
source = ["src/datasmith"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 70
